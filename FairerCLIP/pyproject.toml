[project]
name = "fairerclip"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy==1.26.4",
  "ftfy==6.1.3",
  "tqdm==4.66.1",
  "yacs==0.1.8",
  "regex",
  "pandas",
  "scipy",
  "pillow",
  "imagenetv2-pytorch",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
imagenetv2-pytorch = { git = "https://github.com/modestyachts/ImageNetV2_pytorch" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
